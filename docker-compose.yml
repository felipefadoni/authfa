services:
  postgres:
    image: postgres:18.4
    container_name: authfa-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: authfa
      POSTGRES_PASSWORD: authfa
      POSTGRES_DB: authfa
    ports:
      - "5433:5432"
    volumes:
      - authfa-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authfa -d authfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: authfa:local
    container_name: authfa
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://authfa:authfa@postgres:5432/authfa
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  authfa-postgres:
